name: Publish package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
      
# Keyed by commit: the -M<n> job below is check-then-act, so two runs over one
# commit must serialize. A ref key would group every main push, and only one run
# may be pending - a third would cancel the pending one, costing it its
# coordinate. Never cancelled: that would abort a run mid-deploy.
concurrency:
  group: publish-package-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch carries no ref restriction, so without this any branch could
    # deploy over the mainline SNAPSHOT to Central and GitHub Packages. Tags stay
    # allowed - check-version hard-fails a tag carrying a SNAPSHOT.
    #
    # Not an authorization boundary: a dispatch runs the workflow file from the ref
    # it targets. Enforcement needs an Environment restricted to main.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest 
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - id: check-version
        name: Check if version is SNAPSHOT
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref_type }}" == "tag" && "$VERSION" == *SNAPSHOT ]]; then
            echo "❌ ERROR: Tagged release contains SNAPSHOT version"
            exit 1
          fi
          
          if [[ "${{ github.ref_type }}" == "branch" && "$VERSION" != *SNAPSHOT ]]; then
            echo "❌ ERROR: Push to main requires SNAPSHOT version"
            exit 1
          fi

      - id: install-secret-key
        name: Install GPG secret key
        run: |
          echo -n "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central (Portal)
        run: |
          set -o pipefail
          mvn --batch-mode -Pcentral -Dgpg.passphrase="$GPG_PASSPHRASE" \
              source:jar javadoc:jar -f pom.xml deploy | tee mvn.log

          # For releases, surface the deploymentId so it's easy to find in the Portal UI.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DEP_ID=$(grep -oE 'deploymentId: [a-f0-9-]{36}' mvn.log | awk '{print $2}' | tail -n1)
            {
              echo "### Central Portal Deployment"
              echo ""
              echo "- Version: \`${{ steps.check-version.outputs.version }}\`"
              echo "- Deployment ID: \`${DEP_ID:-not-found}\`"
              echo "- [Open Deployments in Portal](https://central.sonatype.com/publishing/deployments)"
              echo ""
              echo "Click **Publish** next to the deployment to release it to Maven Central."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode -Pgithub source:jar javadoc:jar -f pom.xml deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trigger docs regeneration only after the snapshot/release artifact is published above,
      # so the docs build never resolves a stale interfaces version (the publish runs in a
      # separate workflow and previously raced the build-workflow dispatch).
      # Tag (release) pushes also reach this step and intentionally refresh the `main` docs set
      # (the dispatch targets ref: 'main'); per-tag versioned docs are not produced.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: interfaces-docs-app-token
        with:
          app-id: ${{ vars.INTERFACES_DOCS_APP_ID }}
          private-key: ${{ secrets.INTERFACES_DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            interface-documentation
      - name: Trigger build OpenAPI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.interfaces-docs-app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'interface-documentation',
              workflow_id: 'publish.yml',
              ref: 'main',
            })

  # Immutable pin for a developer whose unrelated core PR is broken by a mainline
  # snapshot change.
  #
  # Its own job so a failed pin can be re-run alone: re-running `publish` would
  # redeploy the SNAPSHOT from this run's commit over whatever came after it.
  #
  # Guarded on the ref, not ref_type: every branch holds a SNAPSHOT and would mint
  # an -M from its own commit count, claiming a number main will later compute.
  immutable-build:
    name: Publish immutable build version
    # Ordered after `publish` so the two deploys do not race on GitHub Packages'
    # artifact-level metadata. !cancelled() keeps the pin independent of it: a
    # failed publish must not cost the pin.
    needs: publish
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the coordinate below carries the commit count, which a
          # shallow clone cannot compute.
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish immutable build version
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read from the pom, not via `mvn help:evaluate`: the Maven form resolves
          # the com.otilm parent from the registry first, so a registry hiccup
          # surfaces as a version-read failure with no diagnostic.
          BASE=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          print(ET.parse("pom.xml").getroot().find("m:version", ns).text.strip())
          PY
          )
          echo "pom version: $BASE"

          # A release-prep commit has no mainline snapshot state to pin, and the
          # release version is itself a permanent coordinate. Skip, do not fail.
          case "$BASE" in
            *-SNAPSHOT) ;;
            *) echo "::notice::$BASE is not a SNAPSHOT - release commit, no pin to mint"; exit 0 ;;
          esac

          # Ordinal orders, SHA addresses. ComparableVersion compares the ordinal
          # before the suffix, so every form stays below the SNAPSHOT and the GA
          # release. A mistyped SHA 404s; a mistyped ordinal resolves a real build.
          MV="${BASE%-SNAPSHOT}-M$(git rev-list --count HEAD)-${GITHUB_SHA:0:8}"

          # A release coordinate the registry will not replace, so a re-run must
          # skip. 2xx/3xx skips, 404 publishes, anything else warns and falls
          # through to let the registry's conflict response decide. Asset GETs
          # redirect to a blob host, so 3xx means it exists. No -L: curl drops
          # Authorization across hosts.
          POM_URL="https://maven.pkg.github.com/omnitrustilm/interfaces/com/otilm/interfaces/$MV/interfaces-$MV.pom"
          # curl writes 000 itself on a connection failure; `|| true` is only for set -e.
          CODE=$(curl -sS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' \
                   -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$POM_URL" || true)
          case "$CODE" in
            20[0-9]|30[0-9]) echo "$MV is already published (HTTP $CODE) - re-run, nothing to do"; exit 0 ;;
            404)             echo "$MV is not present; publishing" ;;
            *)               echo "::warning::Registry probe for $MV returned HTTP $CODE; attempting the deploy and letting the registry decide" ;;
          esac

          # Pinned rather than the `versions` prefix, which resolves whatever release
          # Central serves that day and is invisible to Renovate.
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$MV" -DgenerateBackupPoms=false
          # No source/javadoc jars and no GPG signing: a build pin, not a release.
          mvn -B -ntp -Pgithub -Dmaven.test.skip=true \
              -DretryFailedDeploymentCount=3 deploy

          {
            echo "### Immutable build version"
            echo ""
            echo "\`com.otilm:interfaces:$MV\`"
            echo ""
            echo "Add to the body of a \`core\` PR that someone else's merge has reddened,"
            echo "picking the newest pin below that merge:"
            echo ""
            echo '```'
            echo "Interfaces-Version: $MV"
            echo '```'
            echo ""
            echo "To drop it: delete the line and re-run all jobs."
            echo ""
            echo "<sub>Built from [\`${GITHUB_SHA:0:8}\`]($SERVER_URL/$REPO/commit/$GITHUB_SHA).</sub>"
            echo ""
            echo "The pin stays resolvable for at least 90 days. The ordinal orders these"
            echo "coordinates; it does not measure distance between them, and a release cut"
            echo "leaves no pin of its own - the release version is the pin there."
          } >> "$GITHUB_STEP_SUMMARY"
